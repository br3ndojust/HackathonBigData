name: Promote develop to main

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or reuse PR to main
        id: pr
        run: |
          PR_NUMBER=$(gh pr list --base main --head develop --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "chore: sync develop → main" \
              --body "Promoção automática após merge aprovado na develop."
            PR_NUMBER=$(gh pr list --base main --head develop --json number --jq '.[0].number')
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge "${{ steps.pr.outputs.pr_number }}" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PR_TOKEN }}